name: easygenerator-task

services:
  mongo:
    # 7, not 8: MongoDB 8 refuses to start on hosts running Linux 6.19 or
    # newer (SERVER-121912). 7.0 is supported and unaffected.
    image: mongo:7
    restart: unless-stopped
    # Published on the loopback interface only: reachable from this machine
    # for local development, never from the network.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the Compose network the database is reached by service name.
      MONGODB_URI: mongodb://mongo:27017/easygenerator
      PORT: '3000'
      # The runtime image has no dev dependencies, so logs stay JSON.
      LOG_PRETTY: 'false'
      # Requests arrive through the frontend's nginx: trust that one hop so
      # rate limits apply to the visitor's address, not to nginx.
      TRUST_PROXY_HOPS: '1'
    ports:
      - '127.0.0.1:3000:3000'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:3000
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  mongo-data:
